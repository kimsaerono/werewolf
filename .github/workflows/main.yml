name: Deploy Pages
on:
  push:
    branches: [ master, main ]
    # 打稳定版标签也自动部署：否则标签晚于上次部署创建，线上版本号会停留在旧 tag
    tags: [ 'stable-v*' ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # 必须拉全量历史 + tag，否则 vite.config.ts 的 `git describe --tags` 只能拿到 hash（版本号会显示成裸 hash）
          fetch-depth: 0
          fetch-tags: true

      # 打印用于注入版本号的 git describe 结果，便于排查线上版本号
      - name: Show version
        run: |
          git fetch --tags --force
          echo "describe: $(git describe --tags --always --dirty)"
          echo "tags:"; git tag -l

      # 安装 Bun 环境
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # 注入飞书同步 URL（.env 不入库；口令改为前端运行时输入，不打进公开代码）
      - name: 写入同步配置
        run: |
          echo "VITE_SYNC_URL=https://hymallbosstest.heemoney.com/werewolf-sync" > .env

      # 安装依赖
      - run: bun install 

      # vite打包
      - run: bun run build

      # 上传dist产物（普通vite产物根目录dist）
      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # 部署 Pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
