name: Deploy Pages
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 安装 Bun 环境
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # 注入飞书同步配置（.env 不入库；URL 公开，口令走 GitHub Secret SYNC_PASSWORD）
      - name: 写入同步配置
        run: |
          echo "VITE_SYNC_URL=https://hymallbosstest.heemoney.com/werewolf-sync" > .env
          echo "VITE_SYNC_PASSWORD=${{ secrets.SYNC_PASSWORD }}" >> .env

      # 安装依赖
      - run: bun install 

      # vite打包
      - run: bun run build

      # 上传dist产物（普通vite产物根目录dist）
      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # 部署 Pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
